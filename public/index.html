<!DOCTYPE html>
<html lang="es-mx">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Press Start To Learn</title>
    <link rel="icon" type="image/png" href="TemplateData/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="TemplateData/icons/favicon.svg" />
    <link rel="shortcut icon" href="TemplateData/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Press Start To Learn" />
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="deserthare-container">
      <canvas id="deserthare-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="deserthare-loading-bar">
        <div id="deserthare-logo"></div>
        <div id="deserthare-progress-bar-empty">
          <div id="deserthare-progress-bar-full"></div>
        </div>
      </div>
      <div id="deserthare-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#deserthare-container");
      var canvas = document.querySelector("#deserthare-canvas");
      var loadingBar = document.querySelector("#deserthare-loading-bar");
      var progressBarFull = document.querySelector("#deserthare-progress-bar-full");
      var warningBanner = document.querySelector("#deserthare-warning");
      
      function desertHareShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/public.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/public.data.unityweb",
        frameworkUrl: buildUrl + "/public.framework.js.unityweb",
        codeUrl: buildUrl + "/public.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Desert Hare Studios",
        productName: "Press Start To Learn",
        productVersion: "1.0.1",
        showBanner: desertHareShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
